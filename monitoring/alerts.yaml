# shop-alerts: seven rules in three groups (availability, performance, application).
# Every rule has a `for` so a single bad scrape cannot page anyone, a severity
# label, and an annotation that names the thing that broke and what to do.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: shop-alerts
  namespace: shop
  labels:
    release: monitoring          # belt and braces: ruleSelectorNilUsesHelmValues=false does the real work
spec:
  groups:
    - name: shop-availability
      rules:
        - alert: ShopTargetDown
          expr: up{namespace="shop"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.job }} target {{ $labels.pod }} is not being scraped"
            description: "Prometheus cannot reach {{ $labels.pod }}. Run: kubectl -n shop get pods,endpoints; kubectl -n shop describe pod {{ $labels.pod }}"

        - alert: ShopDeploymentUnavailable
          expr: kube_deployment_status_replicas_available{namespace="shop"} == 0
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "Deployment {{ $labels.deployment }} has no available replicas"
            description: "Nothing is serving {{ $labels.deployment }}. Run: kubectl -n shop get deploy {{ $labels.deployment }}; kubectl -n shop rollout status deploy/{{ $labels.deployment }}"

        - alert: ShopContainerRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="shop"}[15m]) > 3
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.pod }} ({{ $labels.container }}) restarted repeatedly"
            description: "Crash loop or OOM kill. Run: kubectl -n shop logs {{ $labels.pod }} --previous; kubectl -n shop describe pod {{ $labels.pod }}"

    - name: shop-performance
      rules:
        - alert: ShopHighServerErrorRatio
          expr: |
            sum by (job) (rate(flask_http_request_total{namespace="shop",status=~"5.."}[5m]))
              /
            sum by (job) (rate(flask_http_request_total{namespace="shop"}[5m]))
              > 0.05
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.job }}: over 5% of requests are server errors"
            description: "5xx ratio is {{ $value | humanizePercentage }}. Check the dependencies of {{ $labels.job }} first: kubectl -n shop get pods,endpoints"

        - alert: ShopHighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum by (le, job) (rate(flask_http_request_duration_seconds_bucket{namespace="shop"}[5m])))
              > 1
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.job }}: p95 latency above 1s"
            description: "p95 is {{ $value | humanizeDuration }}. Check CPU throttling and any slow dependency: kubectl -n shop top pods"

        - alert: ShopContainerMemoryNearLimit
          expr: |
            container_memory_working_set_bytes{namespace="shop",container!="",container!="POD"}
              /
            (container_spec_memory_limit_bytes{namespace="shop",container!="",container!="POD"} > 0)
              > 0.9
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.pod }} ({{ $labels.container }}) is above 90% of its memory limit"
            description: "An OOM kill is likely. Raise the limit or find the leak: kubectl -n shop top pod {{ $labels.pod }}"

    - name: shop-application
      rules:
        - alert: ShopOrderFailureRatioHigh
          expr: |
            sum(rate(orders_rejected_total{reason=~"catalog_unavailable|store_unavailable"}[5m]))
              /
            (sum(rate(orders_placed_total[5m])) + sum(rate(orders_rejected_total[5m])))
              > 0.2
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "Over 20% of order attempts are failing on a dependency"
            description: "Orders cannot reach catalog or Redis. Run: kubectl -n shop get pods -l app=catalog; kubectl -n shop get pods -l app=redis"

        - alert: ShopCacheHitRatioLow
          expr: |
            (
              sum(rate(order_catalog_cache_lookups_total{outcome="hit"}[10m]))
                /
              sum(rate(order_catalog_cache_lookups_total[10m]))
                < 0.3
            )
            and
            sum(rate(order_catalog_cache_lookups_total[10m])) > 0.05
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Order catalog cache hit ratio is below 30% under real traffic"
            description: "Redis may be down or evicting, so every order now calls catalog. Run: kubectl -n shop exec deploy/redis -- redis-cli ping"