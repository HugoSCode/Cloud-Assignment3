# orders: validates orders against catalog and writes them to Redis.
# Same shape as catalog; differs in image, five env vars, one Secret reference.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: shop
  labels:
    app: orders
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001           # matches useradd --uid 10001 in the Dockerfile
      containers:
        - name: orders
          image: localhost:32000/order-service:v1
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef: { name: shop-config, key: APP_VERSION }
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef: { name: shop-config, key: ENVIRONMENT }
            - name: CATALOG_URL
              valueFrom:
                configMapKeyRef: { name: shop-config, key: CATALOG_URL }
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef: { name: shop-config, key: REDIS_HOST }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: shop-secrets, key: DB_PASSWORD }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          # /healthz checks neither Redis nor catalog. If it did, a Redis
          # outage would fail every replica's readiness at once, empty the
          # Service's endpoints, and turn a degraded service (it can still
          # answer 503 with a clear message) into a total outage.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: shop
  labels:
    app: orders
spec:
  type: ClusterIP
  selector:
    app: orders
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: http