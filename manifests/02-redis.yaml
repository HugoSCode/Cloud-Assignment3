# redis: the order store. The only stateful component, so the only one with a
# volume and a non-default update strategy. ClusterIP only: never reachable
# from outside the cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: shop
spec:
  accessModes: ["ReadWriteOnce"]   # one node mounts it; Redis is a single writer
  resources:
    requests:
      storage: 2Gi
  # storageClassName unset: the default class (microk8s-hostpath) is pointed
  # at /datadisk/microk8s-storage by the bootstrap.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: shop
  labels:
    app: redis
spec:
  replicas: 1                      # single writer; more replicas would not share data
  strategy:
    type: Recreate                 # old Pod stops before the new one starts
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999             # "redis" user in the alpine image (verify)
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: redis
          image: redis:7.2-alpine  # pinned minor version, not a floating tag
          args: ["--appendonly", "yes"]   # without this the PVC holds a file Redis never writes
          ports:
            - containerPort: 6379
              name: redis
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "250m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:          # exec, not httpGet: Redis does not speak HTTP
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:           # slower and more tolerant: restart only a wedged Redis
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: shop
  labels:
    app: redis
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: redis