# frontend: the only service users see, reached through the Ingress.
# ClusterIP on purpose: a NodePort or LoadBalancer would add an unencrypted
# route that bypasses TLS termination and is not in the Task 1 firewall.
# All config comes from shop-config; no credentials, since it owns no data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: frontend
          image: localhost:32000/frontend:v1
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef: { name: shop-config, key: APP_VERSION }
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef: { name: shop-config, key: ENVIRONMENT }
            - name: FEATURE_ORDERING
              valueFrom:
                configMapKeyRef: { name: shop-config, key: FEATURE_ORDERING }
            - name: CATALOG_URL
              valueFrom:
                configMapKeyRef: { name: shop-config, key: CATALOG_URL }
            - name: ORDER_URL
              valueFrom:
                configMapKeyRef: { name: shop-config, key: ORDER_URL }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          # /healthz is static and checks no dependency, so a catalog or
          # orders outage degrades the page instead of making Pods unready.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shop
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: http