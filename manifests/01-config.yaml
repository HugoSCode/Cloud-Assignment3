# shop-config: non-sensitive settings, safe to commit, diff and review.
# Deployments reference these values, never hard-code them, so a change plus
# a rollout restart reconfigures the app with no image rebuild.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: shop
data:
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  FEATURE_ORDERING: "on"              # frontend enables ordering only for "on" (any case)
  CATALOG_URL: "http://catalog:5000"  # Service DNS name, never a Pod IP
  ORDER_URL: "http://orders:5000"
  REDIS_HOST: "redis"
---
# shop-secrets: the credential, kept separate from the ConfigMap so it can be
# handled under different rules. Placeholder only; the real value is set out
# of band (see notes) and never committed.
apiVersion: v1
kind: Secret
metadata:
  name: shop-secrets
  namespace: shop
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME"