# TLS chain, part 1 of 2: an in-cluster certificate authority.
#   selfsigned-bootstrap --signs--> shop-root-ca (isCA) --provides key--> shop-ca-issuer
# The leaf certificate (shop-tls) is signed by shop-ca-issuer and lives in
# 07-ingress.yaml.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}                    # no parent: used once, to create the root CA
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shop-root-ca
  namespace: cert-manager           # MUST be the cluster resource namespace (where
                                    # cert-manager runs), or the CA issuer can never
                                    # find the signing Secret and the leaf never issues
spec:
  isCA: true                        # sets basicConstraints CA:TRUE and certSign key usage
  commonName: Shop Lab Root CA
  subject:
    organizations: ["ID72001 Assessment 3"]
  secretName: shop-root-ca-secret   # holds the CA certificate and its private key
  duration: 17520h                  # 2 years
  renewBefore: 720h                 # renew 30 days before expiry
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: shop-ca-issuer
spec:
  ca:
    secretName: shop-root-ca-secret # looked up in the cluster resource namespace