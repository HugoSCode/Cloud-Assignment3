# TLS chain, part 2 of 2: the leaf certificate and the one route into the cluster.
#   shop-ca-issuer (06-tls.yaml) --signs--> shop-tls --served by--> Ingress "shop"
# The hostname is a placeholder, filled in by scripts/render.sh at deploy time.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: shop-tls
  namespace: shop
spec:
  secretName: shop-tls              # cert-manager writes the kubernetes.io/tls Secret here
  commonName: __SHOP_HOST__
  dnsNames:
    - __SHOP_HOST__                 # browsers validate the SAN, not the commonName
  duration: 2160h                   # 90 days
  renewBefore: 720h                 # renew 30 days before expiry, leaving time to retry
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always          # a renewal gets a fresh key, not the old one re-signed
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: shop-ca-issuer
    kind: ClusterIssuer             # the default kind is Issuer, which is not what we want
    group: cert-manager.io
  # isCA is deliberately absent (false): a leaf must never be able to sign certificates.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: shop
  annotations:
    # With a tls block these are already the default in ingress-nginx; stated
    # explicitly so the redirect does not depend on a default.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx           # named, not relying on the default class
  tls:
    - hosts:
        - __SHOP_HOST__
      secretName: shop-tls          # must match the Certificate's secretName
  rules:
    - host: __SHOP_HOST__
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend      # the only service that may be published
                port:
                  name: http